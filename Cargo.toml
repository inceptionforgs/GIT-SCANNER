[package]
name = "git-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
futures = "0.3"
flume = "0.11"
crossbeam-channel = "0.5"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rayon = "1.10"
moka = { version = "0.12", features = ["sync"] }
regex = "1.10"
once_cell = "1.19"
secp256k1 = { version = "0.27", features = ["global-context"] }
ethers = { version = "2.0", features = ["rustls"] }
hex = "0.4"
sha2 = "0.10"
teloxide = { version = "0.12", features = ["macros"] }
dotenv = "0.15"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# chrono with serde feature
chrono = { version = "0.4", features = ["serde"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jemallocator = "0.5"

# coins-bip39 for English mnemonic
coins-bip39 = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true