[package]
name = "git-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime — Pin to Rust 1.85 compatible
tokio = { version = "=1.35.0", features = ["full", "rt-multi-thread"] }
futures = "=0.3.30"
flume = "=0.11.0"
crossbeam-channel = "=0.5.12"
reqwest = { version = "=0.11.27", features = ["json", "rustls-tls"] }
rayon = "=1.10.0"
moka = { version = "=0.12.8", features = ["sync"] }
regex = "=1.10.6"
once_cell = "=1.19.0"
secp256k1 = { version = "=0.27.0", features = ["global-context"] }
ethers = { version = "=2.0.14", features = ["rustls"] }
hex = "=0.4.3"
sha2 = "=0.10.8"
teloxide = { version = "=0.12.2", features = ["macros"] }
dotenv = "=0.15.0"
thiserror = "=1.0.63"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
chrono = "=0.4.38"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.120"
jemallocator = "=0.5.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true